# Full stack:  cp .env.example .env  (add your API keys)  &&  docker compose up --build
# Open http://localhost:8080
# Dev tip: `docker compose up -d mongo` starts only MongoDB, then run the other services locally (see README).
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  nlp-service:
    build: ./nlp-service
    restart: unless-stopped
    environment:
      NLP_INTERNAL_KEY: ${NLP_INTERNAL_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - nlp_models:/models # sentence-transformers + EasyOCR weights are downloaded once, then cached

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      nlp-service:
        condition: service_started
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/docqa
      NLP_SERVICE_URL: http://nlp-service:8000
      NLP_INTERNAL_KEY: ${NLP_INTERNAL_KEY:-}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CLIENT_ORIGIN: http://localhost:8080
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    ports:
      - "5000:5000"
    volumes:
      - uploads:/app/uploads

  client:
    build: ./client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8080:80"

volumes:
  mongo_data:
  nlp_models:
  uploads:
